name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  temporal-multimodal-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run RealitySlice unit tests
        run: python3 -m unittest discover -s experiments/temporal_multimodal/tests -p 'test_*.py' -v

      - name: Validate raw-ingest envelope consumer
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Run 100k synthetic RealitySlice gate
        run: python3 experiments/temporal_multimodal/run_experiment.py

      - name: Run bounded-state 100k RealitySlice long-stream gate
        run: python3 experiments/temporal_multimodal/run_long_stream.py

      - name: Run adversarial 100k RealitySlice gate
        run: python3 experiments/temporal_multimodal/run_adversarial.py

  release-benchmarks:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Collect reproducible release benchmarks
        run: python3 benchmarks/run_release_benchmarks.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: bit-analyze-release-benchmarks
          path: benchmarks/results/
          if-no-files-found: error

  independent-corpus:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run Canterbury Corpus benchmark
        run: python3 benchmarks/run_canterbury_benchmark.py

      - name: Upload Canterbury evidence
        uses: actions/upload-artifact@v4
        with:
          name: bit-analyze-canterbury-benchmark
          path: benchmarks/results/canterbury/
          if-no-files-found: error
